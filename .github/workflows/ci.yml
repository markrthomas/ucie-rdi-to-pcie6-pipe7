name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Toolchain note: CI uses the OSS CAD Suite (same distribution as local dev), so the
# Verilator that runs here matches the one used to author/verify each commit. This
# removes the apt-Verilator version skew that previously rejected constructs the local
# (newer) Verilator accepts. It also provides iverilog + sby for the upcoming Cocotb
# (Tier 1b) and formal jobs.
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (verilator, iverilog, sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regression (lint + Verilator smoke)
        working-directory: ${{ github.workspace }}
        run: make regress

  coverage:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (verilator, iverilog, sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Lint already ran in sim; build cov model in obj_dir_cov and emit coverage.dat (+ coverage.info if verilator_coverage exists).
      - name: Verilator line coverage build and run
        working-directory: ${{ github.workspace }}
        run: make verilator_cov

      - name: Upload coverage summary (optional)
        uses: actions/upload-artifact@v4
        with:
          name: verilator-coverage-info
          path: coverage.info
          if-no-files-found: ignore

  nl1:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (verilator, iverilog, sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: NUM_LANES=1 smoke (make verilator_nl1)
        working-directory: ${{ github.workspace }}
        run: make verilator_nl1

  # Tier 1b: PyUVM-on-Cocotb cross-check. Promoted from advisory to a REQUIRED gate now that
  # all three cross-checks (datapath / control-plane / message-bus) are green and stable
  # (PLAN.md item 14). Uses a system Python (cocotb-config owns the makefile flow) + the OSS
  # CAD Suite Verilator. It still runs as a separate job, so it never blocks the pure-Verilator
  # release gate (`sim`) from reporting independently.
  cocotb:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (verilator, iverilog, sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cocotb + pyuvm + cocotb-coverage
        run: pip install -r test/cocotb/requirements.txt

      - name: PyUVM cross-checks (datapath + control-plane + message-bus, Verilator)
        working-directory: ${{ github.workspace }}
        run: make -C test/cocotb SIM=verilator all_tests

  # Item 37/38: aggregate performance + coverage + smoke + formal + cocotb into one report
  # (report/{metrics.json,report.md,report.html}), upload it as an artifact, and surface the KPI
  # tables in the run's step-summary. The perf-threshold gate (report_check) runs ADVISORY here
  # (continue-on-error) so a simulation timing wobble never reds the required gate; promote it to
  # a hard gate by dropping continue-on-error once the baselines are stable.
  report:
    needs: [sim, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OSS CAD Suite (verilator, iverilog, sby)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cocotb + pyuvm + cocotb-coverage
        run: pip install -r test/cocotb/requirements.txt

      - name: Generate metrics report
        working-directory: ${{ github.workspace }}
        run: make report

      - name: Publish KPI tables to the run summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: cat report/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload metrics report (json + md + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: report/
          if-no-files-found: ignore

      - name: Perf/quality threshold check (advisory)
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: make report_check
